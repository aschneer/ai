<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule</title>
  <link rel="stylesheet" href="gantt_theme.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
    }
    :root {
      --toggle-w: 1.25rem;
    }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: var(--color-text);
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1.25rem;
      flex-wrap: wrap;
      padding: 0.5rem 1.25rem;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }
    .page-header-main {
      display: flex;
      align-items: baseline;
      gap: 0.75rem 1.25rem;
      flex-wrap: wrap;
      min-width: 0;
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    header p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--color-text-muted);
      white-space: nowrap;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      font-size: 0.7rem;
      color: var(--color-text-muted);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .legend-swatch {
      display: inline-block;
      width: 1.25rem;
      height: 0.55rem;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .legend-swatch.task { background: var(--color-task); }
    .legend-swatch.group {
      background: transparent;
      border-top: 2px solid var(--color-group);
      border-left: 2px solid var(--color-group);
      border-right: 2px solid var(--color-group);
      border-bottom: none;
      border-radius: 0;
      height: 0.5rem;
    }
    .legend-swatch.critical-outline {
      background: var(--color-task);
      box-shadow: 0 0 0 1px var(--color-critical-halo), 0 0 0 2px var(--color-critical);
    }
    .legend-swatch.milestone {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      background: var(--color-milestone);
    }
    .error {
      flex-shrink: 0;
      margin: 0.5rem 1.25rem;
      color: var(--color-error);
    }
    .gantt {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 0 0 1rem;
    }
    .gantt-inner {
      min-width: max(48rem, var(--timeline-min-width, 48rem));
      position: relative;
    }
    .row {
      display: grid;
      grid-template-columns: var(--label-width) 1fr;
      border-bottom: 1px solid var(--color-border);
      min-height: 2rem;
      background: var(--color-surface);
    }
    .row.header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--color-surface-muted);
      font-size: 0.75rem;
      color: var(--color-text-muted);
      box-shadow: 0 1px 0 var(--color-border);
    }
    .row.header .label {
      position: sticky;
      left: 0;
      z-index: 12;
      display: flex;
      align-items: flex-end;
      padding-bottom: 0.35rem;
      background: var(--color-surface-muted);
    }
    .label {
      position: sticky;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 0.35rem 0.75rem;
      padding-left: calc(var(--label-indent, 0.75rem) + var(--toggle-w));
      border-right: 1px solid var(--color-border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: var(--color-surface);
    }
    .label .item-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .label-text {
      min-width: 0;
      flex: 1;
    }
    .row-toggle {
      position: absolute;
      left: var(--label-indent, 0.75rem);
      top: 0;
      bottom: 0;
      width: var(--toggle-w);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--color-text-muted);
    }
    .row-toggle:hover {
      color: var(--color-text);
    }
    .collapse-all {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: var(--color-surface);
      color: var(--color-text-muted);
      cursor: pointer;
    }
    .collapse-all:hover {
      color: var(--color-text);
      border-color: var(--color-border-strong);
    }
    .label.group .item-name {
      font-weight: 600;
    }
    .label-resizer {
      position: fixed;
      width: 6px;
      cursor: col-resize;
      z-index: 11;
      touch-action: none;
    }
    .label-resizer:hover,
    .label-resizer.dragging {
      background: var(--color-resizer-hover);
    }
    .timeline {
      position: relative;
      min-height: 2rem;
      z-index: 0;
      padding-left: var(--timeline-gutter);
    }
    .timeline-header {
      display: grid;
      grid-template-columns: repeat(var(--day-count), minmax(var(--day-col-min), 1fr));
      grid-template-rows: auto auto auto auto;
      width: 100%;
      line-height: 1.2;
    }
    .year-cell {
      grid-row: 1;
      font-weight: 600;
    }
    .month-cell {
      grid-row: 2;
      font-weight: 500;
    }
    .day-cell {
      grid-row: 3;
    }
    .weekday-cell {
      grid-row: 4;
    }
    .header-span {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.15rem 0.2rem;
      border-bottom: 1px solid var(--color-border);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .year-start,
    .month-start {
      border-left: 2px solid var(--color-border-strong);
    }
    .day-col {
      text-align: center;
      padding: 0.1rem 0;
      border-right: 1px solid var(--color-border-subtle);
      border-bottom: 1px solid var(--color-border);
      font-size: 0.65rem;
    }
    .weekday-cell {
      border-bottom: none;
    }
    .day-col.last-col {
      border-right: none;
    }
    .day-col.weekend {
      background: var(--color-weekend);
      color: var(--color-text-subtle);
    }
    .bar-area {
      position: absolute;
      inset: 0.3rem 0;
    }
    .timeline-svg {
      position: absolute;
      top: 0;
      left: var(--label-width);
      right: 0;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: visible;
    }
    .timeline-svg .links path {
      fill: none;
      stroke: var(--color-link);
      stroke-width: 1.5;
    }
    .timeline-svg .links path.critical {
      stroke: var(--color-critical);
      stroke-width: 2;
    }
    .dates {
      font-size: 0.7rem;
      color: var(--color-text-muted);
    }
    @media print {
      html, body {
        height: auto;
        overflow: visible;
      }
      body {
        display: block;
        background: var(--color-surface);
      }
      header {
        border-bottom: 1px solid var(--color-border-print);
      }
      .gantt {
        overflow: visible;
      }
      .gantt-inner {
        min-width: unset;
        width: 100%;
      }
      .row.header {
        position: static;
      }
      .row.header .label,
      .label {
        position: static;
      }
      .timeline-svg {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .label-resizer {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="page-header-main">
      <h1 id="title">Schedule</h1>
      <p id="project-finish">Project finish: —</p>
      <button type="button" id="collapse-all" class="collapse-all" hidden>Collapse all</button>
    </div>
    <div class="legend" aria-label="Bar colors">
      <span class="legend-item"><span class="legend-swatch task"></span> Task</span>
      <span class="legend-item"><span class="legend-swatch critical-outline"></span> Critical path</span>
      <span class="legend-item"><span class="legend-swatch group"></span> Group</span>
      <span class="legend-item"><span class="legend-swatch milestone"></span> Milestone</span>
    </div>
  </header>
  <p id="error" class="error" hidden></p>
  <div class="gantt">
    <div class="gantt-inner" id="gantt-root"></div>
  </div>
  <script src="gantt.js"></script>
</body>
</html>
