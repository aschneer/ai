<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule</title>
  <style>
    :root {
      --bg: #fafafa;
      --grid: #e8e8e8;
      --text: #1a1a1a;
      --muted: #666;
      --task: #4a7fd4;
      --group: #1a1a1a;
      --milestone: #c45c26;
      --critical: #c0392b;
      --label-width: 16rem;
      --day-col-min: 1.1rem;
      --weekend-bg: #d8d8d8;
      --header-major-border: #888;
      --critical-ring: 0 0 0 1px #fff, 0 0 0 3px var(--critical);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--grid);
      background: #fff;
    }
    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    header p {
      margin: 0;
      color: var(--muted);
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .legend-swatch {
      display: inline-block;
      width: 1.25rem;
      height: 0.55rem;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .legend-swatch.task { background: var(--task); }
    .legend-swatch.group {
      background: transparent;
      border-top: 2px solid var(--group);
      border-left: 2px solid var(--group);
      border-right: 2px solid var(--group);
      border-bottom: none;
      border-radius: 0;
      height: 0.5rem;
    }
    .legend-swatch.critical-outline {
      background: var(--task);
      box-shadow: 0 0 0 1px #fff, 0 0 0 2px var(--critical);
    }
    .legend-swatch.milestone {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--milestone);
    }
    .error {
      margin: 1rem 1.25rem;
      color: #a33;
    }
    .gantt {
      overflow-x: auto;
      padding: 0 0 1rem;
    }
    .gantt-inner {
      min-width: max(48rem, var(--timeline-min-width, 48rem));
      position: relative;
    }
    .row {
      display: grid;
      grid-template-columns: var(--label-width) 1fr;
      border-bottom: 1px solid var(--grid);
      min-height: 2rem;
      background: #fff;
    }
    .row.header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f3f3f3;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .row.header .label {
      display: flex;
      align-items: flex-end;
      padding-bottom: 0.35rem;
    }
    .label {
      padding: 0.35rem 0.75rem;
      border-right: 1px solid var(--grid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .label .item-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .label.group .item-name {
      font-weight: 600;
    }
    .label-resizer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--label-width);
      width: 6px;
      margin-left: -3px;
      cursor: col-resize;
      z-index: 3;
      touch-action: none;
    }
    .label-resizer:hover,
    .label-resizer.dragging {
      background: rgba(74, 127, 212, 0.15);
    }
    .timeline {
      position: relative;
      min-height: 2rem;
    }
    .timeline-header {
      display: grid;
      grid-template-columns: repeat(var(--day-count), minmax(var(--day-col-min), 1fr));
      grid-template-rows: auto auto auto auto;
      width: 100%;
      line-height: 1.2;
    }
    .year-cell {
      grid-row: 1;
      font-weight: 600;
    }
    .month-cell {
      grid-row: 2;
      font-weight: 500;
    }
    .day-cell {
      grid-row: 3;
    }
    .weekday-cell {
      grid-row: 4;
    }
    .header-span {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.15rem 0.2rem;
      border-bottom: 1px solid var(--grid);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .year-start,
    .month-start {
      border-left: 2px solid var(--header-major-border);
    }
    .day-col {
      text-align: center;
      padding: 0.1rem 0;
      border-right: 1px solid #efefef;
      border-bottom: 1px solid var(--grid);
      font-size: 0.65rem;
    }
    .weekday-cell {
      border-bottom: none;
    }
    .day-col.last-col {
      border-right: none;
    }
    .day-col.weekend {
      background: var(--weekend-bg);
      color: #444;
    }
    .bar-area {
      position: absolute;
      inset: 0.3rem 0;
    }
    .timeline-svg {
      position: absolute;
      top: 0;
      left: var(--label-width);
      right: 0;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }
    .timeline-svg .links path {
      fill: none;
      stroke: #aaa;
      stroke-width: 1.5;
    }
    .timeline-svg .links path.critical {
      stroke: var(--critical);
      stroke-width: 2;
    }
    .dates {
      font-size: 0.7rem;
      color: var(--muted);
      padding-left: 0.75rem;
    }
    @media print {
      body {
        background: #fff;
      }
      header {
        border-bottom: 1px solid #ccc;
      }
      .gantt {
        overflow: visible;
      }
      .gantt-inner {
        min-width: unset;
        width: 100%;
      }
      .row.header {
        position: static;
      }
      .timeline-svg {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .label-resizer {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Schedule</h1>
    <p id="project-finish">Project finish: —</p>
    <div class="legend" aria-label="Bar colors">
      <span class="legend-item"><span class="legend-swatch task"></span> Task</span>
      <span class="legend-item"><span class="legend-swatch group"></span> Group</span>
      <span class="legend-item"><span class="legend-swatch milestone"></span> Milestone</span>
      <span class="legend-item"><span class="legend-swatch critical-outline"></span> Critical path</span>
    </div>
  </header>
  <p id="error" class="error" hidden></p>
  <div class="gantt">
    <div class="gantt-inner" id="gantt-root"></div>
  </div>
  <script src="gantt.js"></script>
</body>
</html>
