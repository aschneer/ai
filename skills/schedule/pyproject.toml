[project]
name = "schedule-skill"
version = "0.1.0"
description = "YAML project scheduling skill — validation, CPM, and Gantt rendering"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
validate = "schedule.validate:main"
compute = "schedule.compute:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schedule"]

[tool.hatch.build.targets.wheel.force-include]
"src/schedule/assets/gantt.html" = "schedule/assets/gantt.html"
"src/schedule/assets/gantt.js" = "schedule/assets/gantt.js"
"src/schedule/assets/gantt_theme.css" = "schedule/assets/gantt_theme.css"

[tool.pytest.ini_options]
testpaths = ["tests"]
