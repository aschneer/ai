[project]
name = "schedule-skill"
version = "0.1.0"
description = "YAML project scheduling skill — validation, CPM, and Gantt rendering"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
schedule-validate = "schedule.validate:main"
schedule-compute = "schedule.compute_schedule:main"
schedule-render = "schedule.render_gantt:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schedule"]

[tool.pytest.ini_options]
testpaths = ["tests"]
