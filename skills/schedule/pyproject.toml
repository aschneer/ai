[project]
name = "schedule-skill"
version = "0.1.0"
description = "YAML project scheduling skill — validation, CPM, and Gantt rendering"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
schedule-validate = "schedule_lib.validate_cli_lib:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schedule_lib"]
