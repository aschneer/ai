# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: calendar.schema.yaml
title: Schedule calendar
description: Working calendar for schedule duration and date calculations.
type: object
additionalProperties: false
required:
  - weekends
  - holidays
properties:
  weekends:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]
    default: [sat, sun]
  holidays:
    type: array
    uniqueItems: true
    items:
      type: string
      format: date
