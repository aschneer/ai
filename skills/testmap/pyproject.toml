[project]
name = "testmap-skill"
version = "0.1.0"
description = "Test-suite audit skill — assertion quality, input coverage, and behavioral completeness gap report"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.2",
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
discover = "testmap.discover:main"
triage = "testmap.triage:main"
staleness = "testmap.staleness:main"
report = "testmap.report:main"
analysis-cli = "testmap.analysis_cli:main"
query = "testmap.query:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixture repos under tests/fixtures/ contain sample source/test files that are
# inputs to the CLIs, not tests to run.
norecursedirs = ["fixtures"]
